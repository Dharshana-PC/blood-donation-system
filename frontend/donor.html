<!DOCTYPE html>
<html>
<head>
    <title>Donor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Donor Registration</h1>

<input id="donor_name" placeholder="Name">
<select id="donor_blood">
    <option>A+</option><option>A-</option>
    <option>B+</option><option>B-</option>
    <option>O+</option><option>O-</option>
    <option>AB+</option><option>AB-</option>
</select>

<input id="donor_phone" placeholder="Phone">
<input id="donor_location" placeholder="Location">
<input id="donor_pincode" placeholder="Pincode">
<input id="donor_date" type="date">

<button onclick="registerDonor()">Register</button>

<script src="script.js"></script>

</body>
</html>
